query PostBySlug($slug: String!) {
  post:post(where: { slug: $slug }){
    createdAt
    name
    images {
      name
      altText
      filename
    }
    seo
    promo {
      name
      altText
      filename
    }
    description {
      document
    }
    content {
      document
    }
    embed
  }
}