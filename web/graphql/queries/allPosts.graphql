query AllPosts($status: String!, $type: String!) {
  posts(
    orderBy: { name: asc },
    where: {
      status: { equals: $status },
      type: { equals: $type }
    }
  ) {
    createdAt
    order
    seo
    name
    slug
    content {
      document
    }
    images {
      name
      altText
      filename
    }
    promo {
      name
      altText
      filename
    }
    description {
      document
    }
    embed
  }
}